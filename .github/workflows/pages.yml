# Keeps the online edition at the repository root up to date (GitHub Pages: "Deploy from a branch", main, / root).
# On every change to the source, it rebuilds the online edition (no CAD screenshots) and commits index.html,
# fpso/index.html and .nojekyll if they changed. Commits made with GITHUB_TOKEN do not trigger this workflow again.
name: Update online edition
on:
  push:
    branches: [main]
    paths-ignore: ['index.html', 'fpso/**', '.nojekyll']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: online-edition
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd twin && npm ci
      - run: node tools/build.mjs
      - name: Copy the online edition to the repository root
        run: |
          mkdir -p fpso
          cp dist/web/index.html index.html
          cp dist/web/fpso/index.html fpso/index.html
          touch .nojekyll
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add index.html fpso/index.html .nojekyll
          git diff --cached --quiet || (git commit -m "Update online edition" && git push)
